version: 1
backend:
  phases:
    preBuild:
      commands:
        - python3 --version
        - pip3 --version
    build:
      commands:
        - echo 'STARTING BUILD *********'
        # Use `npm install`, not `npm ci`. The Amplify backend depends on the aws-cdk
        # toolchain (e.g. @aws-cdk/toolkit-lib), which ships bundled dependencies that
        # npm ci cannot validate against the lockfile ("Missing: <pkg> from lock file"),
        # causing EUSAGE failures. `npm install` resolves the same tree without erroring.
        - npm install --cache .npm --prefer-offline
        # - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*